# Backend Service Configuration
[[services]]
name = "sparknet-api"
sourceDir = "fire-pred-mvp-main"

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "cd fire-pred-mvp-main && gunicorn main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[services.env]
PORT = "8000"
